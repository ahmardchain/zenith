[package]
name = "zenith-escrow"
version = "0.1.0"
description = "Job escrow settled by Zenith oracle verdicts"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "zenith_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"

[dev-dependencies]
zenith-oracle = { path = "../zenith-oracle", features = ["cpi"] }
